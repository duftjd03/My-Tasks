<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>할 일 관리 앱</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 헤더 -->
        <header class="header">
            <div class="header-top">
                <div>
                    <h1 class="title">✓ My Tasks</h1>
                    <p class="subtitle">오늘의 할 일을 관리하세요</p>
                </div>
                <button id="themToggle" class="theme-toggle" title="다크모드 전환">🌙</button>
            </div>
        </header>

        <!-- 진행률 바 -->
        <div class="progress-section">
            <div class="progress-header">
                <span class="progress-text">진행률</span>
                <span class="progress-percentage">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-stats">
                <span><strong id="completedCount">0</strong> / <strong id="totalCount">0</strong></span>
                <span class="remaining-text">남은 할 일: <strong id="remainingCount">0</strong></span>
            </div>
        </div>

        <!-- 검색 및 액션 바 -->
        <div class="search-section">
            <input
                type="text"
                id="searchInput"
                class="search-input"
                placeholder="할 일 검색..."
                autocomplete="off"
            >
            <button id="clearCompletedBtn" class="clear-completed-btn" title="완료된 항목 모두 삭제">🗑️ 완료된 항목 삭제</button>
        </div>

        <!-- 카테고리 필터 탭 -->
        <div class="category-tabs">
            <button class="tab-btn active" data-category="all">전체</button>
            <button class="tab-btn" data-category="work">업무</button>
            <button class="tab-btn" data-category="personal">개인</button>
            <button class="tab-btn" data-category="study">공부</button>
            <span class="shortcut-hint">💡 단축키: 1=전체, 2=업무, 3=개인, 4=공부</span>
        </div>

        <!-- 할 일 입력 폼 -->
        <div class="input-section">
            <form class="task-form" id="taskForm">
                <div class="form-group">
                    <input
                        type="text"
                        id="taskInput"
                        class="task-input"
                        placeholder="할 일을 입력하세요..."
                        autocomplete="off"
                    >
                    <select id="categorySelect" class="category-select">
                        <option value="personal">개인</option>
                        <option value="work">업무</option>
                        <option value="study">공부</option>
                    </select>
                    <button type="submit" class="add-btn">추가</button>
                </div>
            </form>
        </div>

        <!-- 할 일 목록 -->
        <div class="task-list-section">
            <ul class="task-list" id="taskList">
                <li class="empty-state">
                    <p>아직 할 일이 없습니다.</p>
                    <p class="empty-hint">위에서 새로운 할 일을 추가해보세요!</p>
                </li>
            </ul>
        </div>

        <!-- 하단 정보 -->
        <footer class="footer">
            <p>완료된 할 일을 클릭하면 체크 표시가 됩니다</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
